<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">정책</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div th:replace="header :: headerFragment"></div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="main">
        <div class="container">
            <div class="main-content">
                <div class="page-title">
                    <h1 th:text="${title}"></h1>
                    <p th:text="${subtitle}"></p>
                </div>
                
                <div class="content-section">
                    <p class="date" th:text="${date}"></p>
                </div>

                    <div class="section-container" th:each="section : ${sections}">
                        <div class="content-section">
                            <h2 th:text="${section.title}"></h2>
                        <div th:if="${section.paragraphs != null}">
                            <p th:each="paragraph : ${section.paragraphs}" th:text="${paragraph}"></p>
                        </div>
                        <div th:if="${section.lists != null}">
                            <ul>
                                <li th:each="item : ${section.lists}" th:text="${item}"></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="highlight" th:if="${contactTitle != null}">
                    <p><strong th:text="${contactTitle}"></strong></p>
                    <p th:text="${contactInfo}"></p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
